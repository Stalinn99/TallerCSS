<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo Java Script</title>
    <script src="app/app.js" defer></script>
    <link rel="stylesheet" href="styles/stylesJava.css" />
  </head>
  <body>
    <h1>Holaaaaa</h1>
    <p id="mensaje">Este es un ejemplo de página de HTML con JS</p>
    <button id="boton" type="button">Hola chachos</button>
    <hr />
    <h2>Formulario</h2>
    <form id="formulario">
      <label for="nombre">Nombre:</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Escribe tu nombre"
      />
      <button type="submit">Enviar</button>
    </form>

    <p id="saludo"></p>
    <hr />
    <h2>Personaliza tu tarjeta</h2>
    <div id="tarjeta" class="tarjeta">
      <h3>Bienvenido a mi aplicacion web</h3>
    </div>
    <div class="botones">
      <button id="azul" type="button">Azul</button>
      <button id="verde" type="button">Verde</button>
      <button id="rojo" type="button">Rojo</button>
      <button id="reestablecer" type="button">Reestablecer</button>
    </div>
  </body>
</html>
